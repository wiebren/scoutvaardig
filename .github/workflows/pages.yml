# Publishes the home page of scoutvaardig.nl with GitHub Pages: every push to main. This is the user site
# (wiebren.github.io): its custom domain is also the domain of every project site, so the apps come at
# scoutvaardig.nl/lelievlet/ and /scoutingtechnieken/.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: mkdir _site && cp -r index.html img .nojekyll _site/ && if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
